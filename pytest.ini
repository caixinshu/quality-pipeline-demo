# pytest 配置
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 注册 markers，避免 PytestUnknownMarkWarning
markers =
    smoke: 冒烟测试 - 核心主流程
    regression: 回归测试 - 全面覆盖
    security: 安全相关测试
    performance: 性能相关测试

# 输出格式
addopts = -v --strict-markers
