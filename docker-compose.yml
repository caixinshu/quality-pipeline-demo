version: "3.8"
services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - db-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  ui-test:
    build:
      context: .
      dockerfile: tests/ui/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      - BASE_URL=http://api:8000
    volumes:
      - ./playwright-report:/app/playwright-report
      - ./test-results:/app/test-results

volumes:
  db-data:
