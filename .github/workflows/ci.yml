name: CI Pipeline
# 触发条件：push 到 main/develop 分支时触发
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 第一步：checkout 代码
      - name: Checkout code
        uses: actions/checkout@v4
      # 第二步：打印一句话
      - name: Hello World
        run: echo "CI pipeline triggered successfully!"
      # 第三步：打印环境信息
      - name: Print info
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Runner OS: ${{ runner.os }}"
