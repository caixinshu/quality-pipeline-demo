name: Commit Pipeline (提交级)

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run unit tests with coverage gate
        run: |
          pytest tests/test_unit.py -v \
            --cov=app \
            --cov-report=term \
            --cov-report=html \
            --cov-report=xml \
            --cov-fail-under=70 \
            --junitxml=test-results.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/

  api-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Allure
        uses: actions/cache@v4
        id: allure-cache
        with:
          path: allure-2.24.0
          key: allure-2.24.0

      - name: Install Allure
        run: |
          if [ ! -f allure-2.24.0/bin/allure ]; then
            sudo apt-get update
            sudo apt-get install -y openjdk-11-jre
            wget https://github.com/allure-framework/allure2/releases/download/2.24.0/allure-2.24.0.tgz
            tar -xzf allure-2.24.0.tgz
          else
            sudo apt-get update
            sudo apt-get install -y openjdk-11-jre
          fi
          echo "$(pwd)/allure-2.24.0/bin" >> $GITHUB_PATH

      - name: Cache Docker layers
        uses: actions/cache@v4
        id: docker-cache
        with:
          path: /tmp/.docker-cache
          key: docker-${{ runner.os }}-${{ hashFiles('Dockerfile') }}-${{ hashFiles('app/**') }}
          restore-keys: |
            docker-${{ runner.os }}-

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: demo-api:latest
          cache-from: type=local,src=/tmp/.docker-cache
          cache-to: type=local,dest=/tmp/.docker-cache

      - name: Start API service
        run: |
          docker compose up -d api
          for i in {1..30}; do
            if curl -sf http://localhost:8000/health; then
              echo "Service is ready!"
              break
            fi
            echo "Waiting... ($i)"
            sleep 2
          done

      - name: Run API tests with Allure
        run: |
          pytest tests/ -v \
            --alluredir=allure-results \
            --clean-alluredir \
            --junitxml=test-results.xml

      - name: Generate Allure Report
        if: always()
        run: allure generate allure-results -o allure-report --clean

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::API tests failed! Check the Allure report artifact."

      - name: Cleanup
        if: always()
        run: docker compose down

  code-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install pylint flake8 bandit

      - name: flake8
        run: flake8 app/ --count --statistics
        continue-on-error: true

      - name: pylint
        run: pylint app/ --output-format=text
        continue-on-error: true

      - name: bandit
        run: bandit -r app/ -f txt -o bandit-report.txt
        continue-on-error: true

      - name: Upload scan reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-scan-reports
          path: bandit-report.txt
