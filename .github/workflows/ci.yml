name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      # 1. checkout 代码
      - uses: actions/checkout@v4

      # 2. 安装 Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. 缓存 pip 依赖（加速）
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      # 4. 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      # 5. 运行单元测试
      - name: Run unit tests
        run: |
          pytest tests/test_unit.py -v --cov=app --cov-report=xml

      # 6. 上传覆盖率报告
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  api-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 1. checkout 代码
      - uses: actions/checkout@v4

      # 2. 安装 Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. 安装测试依赖
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. 安装 Allure 命令行工具
      - name: Install Allure
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-11-jre
          wget https://github.com/allure-framework/allure2/releases/download/2.24.0/allure-2.24.0.tgz
          tar -xzf allure-2.24.0.tgz
          echo "$(pwd)/allure-2.24.0/bin" >> $GITHUB_PATH

      # 5. 构建 Docker 镜像
      - name: Build Docker image
        run: docker build -t demo-api .

      # 6. 启动服务
      - name: Start services
        run: |
          docker compose up -d --wait
          sleep 5

      # 7. 等待服务就绪
      - name: Wait for service ready
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8000/health; then
              echo "Service is ready!"
              break
            fi
            echo "Waiting... ($i)"
            sleep 2
          done

      # 8. 运行接口测试并生成 Allure 结果
      - name: Run API tests with Allure
        run: |
          pytest tests/test_api.py -v \
            --alluredir=allure-results \
            --clean-alluredir

      # 9. 生成 Allure HTML 报告
      - name: Generate Allure Report
        if: always()
        run: allure generate allure-results -o allure-report --clean

      # 10. 上传 Allure 报告
      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report

      # 11. 失败时发送通知
      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::API tests failed! Check the Allure report artifact."

      # 12. 清理
      - name: Cleanup
        if: always()
        run: docker compose down
