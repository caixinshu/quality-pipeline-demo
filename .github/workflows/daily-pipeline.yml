name: Daily Full Regression (每日级)

on:
  schedule:
    - cron: '0 18 * * *'  # UTC 18:00 = 北京时间凌晨 2:00
  workflow_dispatch:

jobs:
  full-api-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov requests allure-pytest

      - name: Install Allure
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-11-jre
          wget https://github.com/allure-framework/allure2/releases/download/2.24.0/allure-2.24.0.tgz
          tar -xzf allure-2.24.0.tgz
          echo "$(pwd)/allure-2.24.0/bin" >> $GITHUB_PATH

      - name: Build & start services
        run: |
          docker build -t demo-api .
          docker compose up -d api
          for i in {1..30}; do
            if curl -sf http://localhost:8000/health; then
              echo "Service is ready!"
              break
            fi
            echo "Waiting... ($i)"
            sleep 2
          done

      - name: Run full regression tests
        run: |
          pytest tests/ -v \
            --alluredir=allure-results \
            --clean-alluredir \
            --junitxml=test-results.xml \
            --cov=app \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=70

      - name: Quality gate check
        run: python scripts/quality_gate.py --junit test-results.xml --min-pass-rate 1.0

      - name: Generate Allure report
        if: always()
        run: allure generate allure-results -o allure-report --clean
        continue-on-error: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-report-${{ github.run_id }}
          path: |
            allure-report/
            htmlcov/
            test-results.xml
            coverage.xml

      - name: Cleanup
        if: always()
        run: docker compose down

  full-code-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install pylint flake8 bandit

      - name: flake8
        run: flake8 app/ --count --statistics
        continue-on-error: true

      - name: pylint
        run: pylint app/ --output-format=text
        continue-on-error: true

      - name: bandit
        run: bandit -r app/ -f txt -o bandit-report.txt
        continue-on-error: true

      - name: Security quality gate
        run: python scripts/quality_gate.py --bandit bandit-report.txt

      - name: Upload scan reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-scan-${{ github.run_id }}
          path: |
            bandit-report.txt

  # 全量 UI 测试（每日级）- 多浏览器并行矩阵
  full-ui-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package.json') }}
          restore-keys: |
            pw-${{ runner.os }}-${{ matrix.browser }}-

      - name: Install Playwright
        run: |
          npm install @playwright/test
          npx playwright install --with-deps ${{ matrix.browser }}

      - name: Install Playwright deps only (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install API deps
        run: pip install -r requirements.txt

      - name: Build & start API
        run: |
          docker build -t demo-api .
          docker compose up -d api
          for i in {1..30}; do
            if curl -sf http://localhost:8000/health; then
              echo "Service is ready!"
              break
            fi
            echo "Waiting... ($i)"
            sleep 2
          done

      - name: Run full UI tests (${{ matrix.browser }})
        run: npx playwright test --project=${{ matrix.browser }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-ui-report-${{ matrix.browser }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/

      - name: Upload trace files
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: daily-ui-traces-${{ matrix.browser }}-${{ github.run_id }}
          path: test-results/**/trace.zip

      - name: Cleanup
        if: always()
        run: docker compose down
