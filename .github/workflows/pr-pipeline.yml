name: PR Pipeline (合并级)

on:
  pull_request:
    branches: [ main, develop ]
    types: [ opened, synchronize, reopened ]

jobs:
  # PR 只跑冒烟集，保证速度
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest requests allure-pytest

      - name: Build & start API
        run: |
          docker build -t demo-api .
          docker compose up -d
          for i in {1..30}; do
            if curl -sf http://localhost:8000/health; then
              echo "Service is ready!"
              break
            fi
            echo "Waiting... ($i)"
            sleep 2
          done

      - name: Run smoke tests
        run: |
          pytest tests/ -m smoke -v \
            --alluredir=allure-results \
            --clean-alluredir \
            --junitxml=test-results.xml

      - name: Quality gate check
        run: python scripts/quality_gate.py --junit test-results.xml --min-pass-rate 1.0

      - name: Install Allure
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-11-jre
          wget https://github.com/allure-framework/allure2/releases/download/2.24.0/allure-2.24.0.tgz
          tar -xzf allure-2.24.0.tgz
          echo "$(pwd)/allure-2.24.0/bin" >> $GITHUB_PATH

      - name: Generate Allure Report
        if: always()
        run: allure generate allure-results -o allure-report --clean

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-smoke-report
          path: allure-report

      - name: Cleanup
        if: always()
        run: docker compose down

  # 精准测试：根据代码变更自动筛选测试用例
  precision-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest requests allure-pytest

      - name: Run precision test analysis
        id: precision
        run: |
          python scripts/precision_test.py --mode pr --output .precision_cmd.txt --dry-run
          CMD=$(cat .precision_cmd.txt)
          echo "pytest_cmd=$CMD" >> $GITHUB_OUTPUT
          echo "Precision selected command: $CMD"

      - name: Build & start API
        run: |
          docker build -t demo-api .
          docker compose up -d
          for i in {1..30}; do
            if curl -sf http://localhost:8000/health; then
              echo "Service is ready!"
              break
            fi
            echo "Waiting... ($i)"
            sleep 2
          done

      - name: Run selected tests
        run: |
          ${{ steps.precision.outputs.pytest_cmd }} \
            --alluredir=allure-results \
            --clean-alluredir \
            --junitxml=test-results.xml

      - name: Quality gate check
        run: python scripts/quality_gate.py --junit test-results.xml --min-pass-rate 1.0

      - name: Install Allure
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-11-jre
          wget https://github.com/allure-framework/allure2/releases/download/2.24.0/allure-2.24.0.tgz
          tar -xzf allure-2.24.0.tgz
          echo "$(pwd)/allure-2.24.0/bin" >> $GITHUB_PATH

      - name: Generate Allure Report
        if: always()
        run: allure generate allure-results -o allure-report --clean
        continue-on-error: true

      - name: Upload precision report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-precision-report
          path: allure-report

      - name: Save precision stats
        if: always()
        run: |
          python scripts/precision_test.py --mode pr --dry-run 2>&1 | tee precision-stats.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: precision-stats
          path: precision-stats.txt

      - name: Cleanup
        if: always()
        run: docker compose down

  # UI 冒烟测试（与接口冒烟并行）
  ui-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            pw-${{ runner.os }}-

      - name: Install Playwright
        run: |
          npm install @playwright/test
          npx playwright install --with-deps chromium

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install API deps
        run: pip install -r requirements.txt

      - name: Build & start services
        run: |
          docker build -t demo-api .
          docker compose up -d
          for i in {1..30}; do
            if curl -sf http://localhost:8000/health; then
              echo "Service is ready!"
              break
            fi
            echo "Waiting... ($i)"
            sleep 2
          done

      - name: Run UI smoke tests
        run: npx playwright test --project=chromium

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

      - name: Upload trace files
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/**/trace.zip

      - name: Cleanup
        if: always()
        run: docker compose down

  # 代码扫描也在 PR 中跑
  code-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 bandit

      - name: flake8
        run: flake8 app/ --count --statistics
        continue-on-error: true

      - name: bandit
        run: bandit -r app/ -f txt -o bandit-report.txt
        continue-on-error: true

      - name: Security quality gate
        run: python scripts/quality_gate.py --bandit bandit-report.txt
